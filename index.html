<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechnoCrats GSV</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Sekuya&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --tc-bg: #0d0f0e;
      --tc-grid: rgba(208, 74, 58, 0.055);
      --tc-border: rgba(184, 148, 82, 0.28);
      --tc-heading: #f1eee6;
      --tc-red: #d04a3a;
      --tc-gold: #b89452;
      --tc-muted: rgba(241, 238, 230, 0.42);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 100vh;
      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      background-color: var(--tc-bg);

      background-image:
        repeating-linear-gradient(
          0deg,
          var(--tc-grid) 0px,
          var(--tc-grid) 1px,
          transparent 1px,
          transparent 40px
        ),
        repeating-linear-gradient(
          90deg,
          var(--tc-grid) 0px,
          var(--tc-grid) 1px,
          transparent 1px,
          transparent 40px
        );

      font-family: "JetBrains Mono", monospace;
      color: var(--tc-heading);
    }

    /* =========================================
       OUTER FRAME
    ========================================= */

    .tc-frame {
      position: absolute;
      inset: 12px;

      border: 1px solid var(--tc-border);
      border-radius: 16px;

      pointer-events: none;
    }

    .tc-frame::before,
    .tc-frame::after {
      content: "";

      position: absolute;

      width: 70px;
      height: 70px;

      border-color: var(--tc-gold);
      opacity: 0.6;
    }

    .tc-frame::before {
      top: -1px;
      left: -1px;

      border-top: 1px solid;
      border-left: 1px solid;

      border-radius: 16px 0 0 0;
    }

    .tc-frame::after {
      right: -1px;
      bottom: -1px;

      border-right: 1px solid;
      border-bottom: 1px solid;

      border-radius: 0 0 16px 0;
    }

    /* =========================================
       CORNER SYMBOLS
    ========================================= */

    .tc-corner {
      position: absolute;

      z-index: 5;

      font-family: "JetBrains Mono", monospace;
      font-weight: 700;

      user-select: none;
      pointer-events: none;
    }

    .tc-tl {
      top: 28px;
      left: 34px;

      color: var(--tc-red);
      font-size: clamp(16px, 1.8vw, 28px);

      opacity: 0.75;
    }

    .tc-tr {
      top: 28px;
      right: 34px;

      color: var(--tc-gold);
      font-size: clamp(13px, 1.3vw, 21px);

      opacity: 0.5;
    }

    .tc-bl {
      bottom: 27px;
      left: 34px;

      color: var(--tc-red);
      font-size: clamp(13px, 1.3vw, 21px);

      opacity: 0.45;
    }

    .tc-br {
      right: 34px;
      bottom: 27px;

      color: var(--tc-gold);
      font-size: clamp(16px, 1.8vw, 28px);

      opacity: 0.75;
    }

    /* =========================================
       SIDE LABELS
    ========================================= */

    .tc-code {
      position: absolute;

      top: 50%;

      z-index: 2;

      font-size: clamp(7px, 0.65vw, 11px);
      letter-spacing: 2px;

      color: var(--tc-muted);

      opacity: 0.3;

      writing-mode: vertical-rl;

      transform: translateY(-50%);
    }

    .tc-code-left {
      left: 22px;
    }

    .tc-code-right {
      right: 22px;

      transform:
        translateY(-50%)
        rotate(180deg);
    }

    /* =========================================
       CENTER CONTENT
    ========================================= */

    .tc-content {
      position: relative;

      z-index: 10;

      width: min(90vw, 1200px);

      text-align: center;
    }

    /* Status */

    .tc-status {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 10px;

      margin-bottom: clamp(14px, 2vh, 24px);

      color: var(--tc-muted);

      font-size: clamp(9px, 0.8vw, 14px);

      letter-spacing: clamp(2px, 0.35vw, 5px);

      text-transform: uppercase;
    }

    .tc-status-dot {
      width: 7px;
      height: 7px;

      flex-shrink: 0;

      border-radius: 50%;

      background: var(--tc-red);

      box-shadow:
        0 0 8px rgba(208, 74, 58, 0.8),
        0 0 20px rgba(208, 74, 58, 0.25);
    }

    /* =========================================
       MAIN TITLE
    ========================================= */

    h1 {
      margin: 0;

      font-family: "Sekuya", sans-serif;

      font-size: clamp(
        34px,
        6.2vw,
        108px
      );

      font-weight: 400;

      line-height: 1;

      letter-spacing: clamp(
        -1px,
        -0.15vw,
        -3px
      );

      color: var(--tc-heading);

      text-transform: uppercase;

      text-shadow:
        0 0 30px rgba(184, 148, 82, 0.08);
    }

    /* =========================================
       SUBTITLE
    ========================================= */

    .tc-subtitle {
      margin-top: clamp(14px, 2vh, 24px);

      color: var(--tc-gold);

      font-size: clamp(8px, 0.75vw, 13px);

      letter-spacing: clamp(
        2px,
        0.35vw,
        5px
      );

      text-transform: uppercase;

      opacity: 0.72;
    }

    /* =========================================
       DECORATIVE CENTER LINE
    ========================================= */

    .tc-line {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 12px;

      margin-top: clamp(20px, 3vh, 36px);
    }

    .tc-line span {
      display: block;

      width: clamp(30px, 5vw, 90px);
      height: 1px;

      background: linear-gradient(
        90deg,
        transparent,
        var(--tc-border)
      );
    }

    .tc-line span:last-child {
      background: linear-gradient(
        90deg,
        var(--tc-border),
        transparent
      );
    }

    .tc-line-dot {
      width: 4px;
      height: 4px;

      border-radius: 50%;

      background: var(--tc-gold);

      opacity: 0.6;
    }

    /* =========================================
       FOOTER
    ========================================= */

    .tc-footer {
      position: absolute;

      left: 0;
      right: 0;
      bottom: clamp(28px, 4vh, 50px);

      z-index: 20;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: clamp(18px, 2.5vw, 40px);
    }

    .tc-footer::before {
      content: "";

      position: absolute;

      top: clamp(-18px, -2vh, -10px);

      width: clamp(80px, 12vw, 180px);
      height: 1px;

      background: linear-gradient(
        90deg,
        transparent,
        var(--tc-border),
        transparent
      );
    }

    .tc-social {
      position: relative;

      color: var(--tc-muted);

      text-decoration: none;

      font-size: clamp(8px, 0.7vw, 12px);

      letter-spacing: clamp(
        1px,
        0.2vw,
        3px
      );

      transition:
        color 0.25s ease,
        transform 0.25s ease;
    }

    .tc-social:hover {
      color: var(--tc-gold);

      transform: translateY(-2px);
    }

    .tc-social:not(:last-child)::after {
      content: "/";

      position: absolute;

      right: clamp(-14px, -1vw, -8px);

      color: rgba(184, 148, 82, 0.3);

      pointer-events: none;
    }

    /* =========================================
       RESPONSIVE
    ========================================= */

    @media (max-width: 700px) {

      .tc-frame {
        inset: 8px;
        border-radius: 10px;
      }

      .tc-tl {
        top: 18px;
        left: 20px;
      }

      .tc-tr {
        top: 18px;
        right: 20px;
      }

      .tc-bl {
        bottom: 18px;
        left: 20px;
      }

      .tc-br {
        right: 20px;
        bottom: 18px;
      }

      .tc-code {
        display: none;
      }

      .tc-content {
        width: 92vw;
      }

      h1 {
        font-size: clamp(
          28px,
          9vw,
          60px
        );

        letter-spacing: -1px;
      }

      .tc-subtitle {
        letter-spacing: 2px;
      }

      .tc-footer {
        bottom: 28px;
        gap: 16px;
      }
    }

    @media (max-width: 420px) {

      .tc-status {
        font-size: 8px;
        letter-spacing: 2px;
      }

      h1 {
        font-size: clamp(
          25px,
          10vw,
          42px
        );
      }

      .tc-subtitle {
        font-size: 7px;
        letter-spacing: 1.5px;
      }

      .tc-social {
        font-size: 7px;
        letter-spacing: 1px;
      }
    }

    /* =========================================
       REDUCED MOTION
    ========================================= */

    @media (prefers-reduced-motion: reduce) {
      .tc-social {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <!-- =======================================
       FRAME
  ======================================== -->

  <div class="tc-frame"></div>

  <!-- =======================================
       CORNERS
  ======================================== -->

  <span class="tc-corner tc-tl">&lt;/&gt;</span>

  <span class="tc-corner tc-tr">
    { }
  </span>

  <span class="tc-corner tc-bl">
    ;
  </span>

  <span class="tc-corner tc-br">&lt;/&gt;</span>

  <!-- =======================================
       SIDE IDENTIFIERS
  ======================================== -->

  <span class="tc-code tc-code-left">
    TECHN0CRATS.GSV
  </span>

  <span class="tc-code tc-code-right">
    CRYPTONX_26
  </span>

  <!-- =======================================
       CENTER
  ======================================== -->

  <main class="tc-content">

    <div class="tc-status">
      <span class="tc-status-dot"></span>
      SYSTEM ONLINE
    </div>

    <h1>
      TechnoCrats GSV
    </h1>

    <div class="tc-subtitle">
      Building · Breaking · Innovating
    </div>

    <div class="tc-line">
      <span></span>
      <div class="tc-line-dot"></div>
      <span></span>
    </div>

  </main>

  <!-- =======================================
       SOCIAL FOOTER
  ======================================== -->

  <footer class="tc-footer">

    <a
      class="tc-social"
      href="https://www.instagram.com/"
      target="_blank"
      rel="noopener noreferrer"
    >
      INSTAGRAM
    </a>

    <a
      class="tc-social"
      href="https://www.linkedin.com/"
      target="_blank"
      rel="noopener noreferrer"
    >
      LINKEDIN
    </a>

    <a
      class="tc-social"
      href="https://github.com/"
      target="_blank"
      rel="noopener noreferrer"
    >
      GITHUB
    </a>

  </footer>

</body>
</html>
